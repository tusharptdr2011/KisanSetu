<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kisan Setu - Live Queue</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8f3;
            color: #173b27;
        }

        /* NAVBAR */

        nav {
            background: #176b3a;
            color: white;
            padding: 16px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .dashboard-btn {
            background: white;
            color: #176b3a;

            border: none;
            padding: 9px 16px;

            border-radius: 8px;
            cursor: pointer;

            font-weight: bold;
        }

        /* MAIN */

        .container {
            width: 90%;
            max-width: 900px;

            margin: 35px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #667;
        }

        /* QUEUE CARD */

        .queue-card {
            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);

            text-align: center;
        }

        .status-badge {
            display: inline-block;

            padding: 8px 18px;

            border-radius: 20px;

            background: #e5f6e9;
            color: #176b3a;

            font-weight: bold;

            margin-bottom: 20px;
        }

        /* TOKEN */

        .token-label {
            color: #667;
            margin-bottom: 5px;
        }

        .token {
            font-size: 64px;

            font-weight: bold;

            color: #176b3a;

            margin-bottom: 25px;
        }

        /* STATS */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 25px;
        }

        .stat {
            background: #eef8f0;

            padding: 20px;

            border-radius: 14px;
        }

        .stat-number {
            font-size: 30px;

            font-weight: bold;

            color: #176b3a;

            margin-bottom: 5px;
        }

        .stat-label {
            color: #555;
            font-size: 14px;
        }

        /* DETAILS */

        .details {
            text-align: left;

            border-top: 1px solid #ddd;

            padding-top: 25px;
        }

        .detail-row {
            display: flex;

            justify-content: space-between;

            padding: 12px 0;

            border-bottom: 1px solid #eee;
        }

        .detail-label {
            color: #666;
        }

        .detail-value {
            font-weight: bold;
        }

        /* REFRESH */

        .refresh-btn {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #176b3a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #12552f;
        }

        /* MESSAGE */

        .message {
            text-align: center;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);
        }

        .message-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .message h2 {
            margin-bottom: 10px;
        }

        .message p {
            color: #666;
        }

        /* MOBILE */

        @media(max-width: 650px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .token {
                font-size: 50px;
            }

            .header h1 {
                font-size: 26px;
            }

            .queue-card {
                padding: 25px 18px;
            }

        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            🌾 Kisan Setu
        </div>

        <button
            class="dashboard-btn"
            onclick="goDashboard()">

            ← Dashboard

        </button>

    </nav>


    <!-- MAIN -->

    <div class="container">

        <div class="header">

            <h1>⏳ Live Queue Status</h1>

            <p>
                Track your position at the procurement centre.
            </p>

        </div>


        <!-- QUEUE CONTENT -->

        <div id="queueContainer">

            <div class="message">

                <div class="message-icon">
                    ⏳
                </div>

                <h2>
                    Loading Queue...
                </h2>

                <p>
                    Please wait.
                </p>

            </div>

        </div>

    </div>


<script>

    // =========================================
    // CHECK LOGIN
    // =========================================

    const farmer =
        JSON.parse(
            localStorage.getItem("farmer")
        );


    if (!farmer) {

        alert("Please login first.");

        window.location.href =
            "login.html";

    }


    const farmerId =
        farmer.id;


    // =========================================
    // LOAD QUEUE
    // =========================================

    async function loadQueue() {

        const container =
            document.getElementById(
                "queueContainer"
            );


        try {

            const response =
                await fetch(
                    `/api/queue/${farmerId}`
                );


            const data =
                await response.json();


            // ==========================
            // NO ACTIVE QUEUE
            // ==========================

            if (!response.ok) {

                container.innerHTML = `

                    <div class="message">

                        <div class="message-icon">
                            🎟️
                        </div>

                        <h2>
                            No Active Queue
                        </h2>

                        <p>
                            You don't have an active procurement booking.
                        </p>

                        <button
                            class="refresh-btn"
                            onclick="goDashboard()">

                            Go to Dashboard

                        </button>

                    </div>

                `;

                return;

            }


            const queue =
                Array.isArray(data)
                ? data[0]
                : data;


            if (!queue) {

                container.innerHTML = `

                    <div class="message">

                        <div class="message-icon">
                            🎟️
                        </div>

                        <h2>
                            No Active Queue
                        </h2>

                        <p>
                            You don't have an active procurement booking.
                        </p>

                    </div>

                `;

                return;

            }


            // ==========================
            // QUEUE DISPLAY
            // ==========================

            container.innerHTML = `

                <div class="queue-card">

                    <div class="status-badge">
                        🟢 ${queue.status}
                    </div>


                    <div class="token-label">
                        Your Token
                    </div>

                    <div class="token">
                        ${queue.token_number}
                    </div>


                    <div class="stats">

                        <div class="stat">

                            <div class="stat-number">
                                ${queue.position}
                            </div>

                            <div class="stat-label">
                                Your Position
                            </div>

                        </div>


                        <div class="stat">

                            <div class="stat-number">
                                ${queue.farmers_ahead}
                            </div>

                            <div class="stat-label">
                                Farmers Ahead
                            </div>

                        </div>


                        <div class="stat">

                            <div class="stat-number">
                                ${queue.estimated_wait}
                            </div>

                            <div class="stat-label">
                                Estimated Wait (min)
                            </div>

                        </div>

                    </div>


                    <div class="details">

                        <div class="detail-row">

                            <span class="detail-label">
                                📍 Procurement Centre
                            </span>

                            <span class="detail-value">
                                ${queue.centre_name}
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-label">
                                📅 Date
                            </span>

                            <span class="detail-value">
                                ${formatDate(queue.slot_date)}
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-label">
                                🕐 Time
                            </span>

                            <span class="detail-value">
                                ${formatTime(queue.start_time)}
                                -
                                ${formatTime(queue.end_time)}
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-label">
                                🎟️ Token
                            </span>

                            <span class="detail-value">
                                ${queue.token_number}
                            </span>

                        </div>

                    </div>


                    <button
                        class="refresh-btn"
                        onclick="loadQueue()">

                        🔄 Refresh Queue

                    </button>

                </div>

            `;


        } catch (error) {

            console.log(error);


            container.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        ⚠️
                    </div>

                    <h2>
                        Unable to Load Queue
                    </h2>

                    <p>
                        Please check that the server is running.
                    </p>


                    <button
                        class="refresh-btn"
                        onclick="loadQueue()">

                        🔄 Try Again

                    </button>

                </div>

            `;

        }

    }


    // =========================================
    // FORMAT DATE
    // =========================================

    function formatDate(date) {

        if (!date) {
            return "--";
        }


        const d =
            new Date(date);


        return d.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );

    }


    // =========================================
    // FORMAT TIME
    // =========================================

    function formatTime(time) {

        if (!time) {
            return "--";
        }


        const parts =
            time.split(":");


        let hour =
            parseInt(parts[0]);


        const minute =
            parts[1];


        const ampm =
            hour >= 12
            ? "PM"
            : "AM";


        hour =
            hour % 12 || 12;


        return `${hour}:${minute} ${ampm}`;

    }


    // =========================================
    // DASHBOARD
    // =========================================

    function goDashboard() {

        window.location.href =
            "dashboard.html";

    }


    // =========================================
    // START
    // =========================================

    loadQueue();

</script>

</body>
</html>
