<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kisan Setu | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f8f5;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #14231d;
        }

        .login-container {
            width: 900px;
            min-height: 550px;

            background: white;

            display: grid;
            grid-template-columns: 45% 55%;

            border-radius: 18px;
            overflow: hidden;

            box-shadow: 0 15px 40px rgba(0, 70, 45, 0.12);

            position: relative;
        }

        /* =========================
           LEFT SIDE
        ========================== */

        .login-image {
            background:
                linear-gradient(
                    rgba(0, 70, 45, 0.35),
                    rgba(0, 60, 40, 0.45)
                ),
                url("https://images.pexels.com/photos/30269788/pexels-photo-30269788.jpeg");

            background-size: cover;
            background-position: center;

            position: relative;
        }

        .overlay {
            height: 100%;
            padding: 35px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            color: white;
        }

        /* LOGO */

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 23px;
            font-weight: 800;
        }

        .leaf {
            font-size: 28px;
        }

        /* LEFT CONTENT */

        .image-content {
            margin-bottom: 25px;
        }

        .image-content h1 {
            font-size: 32px;
            line-height: 1.2;

            margin-bottom: 15px;
        }

        .image-content p {
            max-width: 320px;

            font-size: 15px;
            line-height: 1.6;
        }

        /* =========================
           RIGHT SIDE
        ========================== */

        .login-section {
            padding: 50px;

            display: flex;
            align-items: center;
        }

        .login-form {
            width: 100%;
        }

        /* HEADING */

        .login-form h2 {
            font-size: 29px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #727d78;
            font-size: 14px;

            margin-bottom: 30px;
        }

        /* =========================
           LANGUAGE
        ========================== */

        .language-wrapper {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 20;
        }

        .language-select {
            border: 1px solid #087747;
            background: white;
            color: #087747;

            padding: 8px 10px;
            border-radius: 8px;

            font-size: 12px;
            font-weight: 700;

            cursor: pointer;
            outline: none;
        }

        .language-select:focus {
            box-shadow: 0 0 0 3px rgba(8, 119, 71, 0.08);
        }

        /* =========================
           INPUTS
        ========================== */

        .input-group {
            margin-bottom: 19px;
        }

        .input-group label {
            display: block;

            font-size: 14px;
            font-weight: 600;

            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            height: 48px;

            border: 1px solid #d7e0db;
            border-radius: 8px;

            padding: 0 14px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #087747;

            box-shadow:
                0 0 0 3px rgba(8, 119, 71, 0.08);
        }

        /* =========================
           PASSWORD
        ========================== */

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .show-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #087747;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
        }

        /* =========================
           OPTIONS
        ========================== */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 4px 0 23px;

            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;

            color: #68736e;
        }

        .remember input {
            accent-color: #087747;
        }

        .forgot {
            color: #087747;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-btn {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 8px;

            background: #087747;
            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #065d39;
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           REGISTER
        ========================== */

        .register {
            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color: #68736e;
        }

        .register a {
            color: #087747;

            text-decoration: none;

            font-weight: 700;

            margin-left: 4px;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* =========================
           ERROR MESSAGE
        ========================== */

        .error {
            color: #d43838;

            font-size: 12px;

            display: block;

            margin-top: 5px;

            min-height: 14px;
        }

        /* SERVER MESSAGE */

        .server-message {
            display: none;

            padding: 10px 12px;

            margin-bottom: 16px;

            border-radius: 8px;

            font-size: 13px;

            line-height: 1.4;
        }

        .server-message.error-message {
            display: block;
            color: #b42318;
            background: #fde9e9;
            border: 1px solid #f3caca;
        }

        .server-message.success-message {
            display: block;
            color: #087747;
            background: #eaf7ee;
            border: 1px solid #cce8d6;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 750px) {

            body {
                padding: 20px;
            }

            .login-container {
                width: 100%;
                max-width: 450px;

                grid-template-columns: 1fr;
            }

            .login-image {
                display: none;
            }

            .login-section {
                padding: 35px 28px;
            }

            .login-form h2 {
                text-align: center;
            }

            .subtitle {
                text-align: center;
            }

            .language-wrapper {
                top: 12px;
                right: 12px;
            }
        }

        @media (max-width: 400px) {

            .login-section {
                padding: 30px 20px;
            }

            .options {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         LOGIN CONTAINER
    ========================== -->

    <div class="login-container">

        <!-- LANGUAGE -->

        <div class="language-wrapper">

            <select
                id="languageSelect"
                class="language-select"
                onchange="applyLanguage(this.value)"
                aria-label="Language"
            >
                <option value="en">🌐 English</option>
                <option value="hi">🇮🇳 हिन्दी</option>
                <option value="gu">🇮🇳 ગુજરાતી</option>
            </select>

        </div>


        <!-- =====================
             LEFT IMAGE
        ====================== -->

        <div class="login-image">

            <div class="overlay">

                <div class="brand">

                    <span class="leaf">🌾</span>

                    <span>KISAN SETU</span>

                </div>


                <div class="image-content">

                    <h1 data-i18n="heroTitle">
                        Smart Procurement.<br>
                        Better Farming.
                    </h1>

                    <p data-i18n="heroText">
                        Book your procurement slot,
                        track your queue and manage
                        your procurement easily.
                    </p>

                </div>

            </div>

        </div>


        <!-- =====================
             LOGIN FORM
        ====================== -->

        <div class="login-section">

            <div class="login-form">

                <h2 data-i18n="welcome">
                    Welcome Back!
                </h2>

                <p
                    class="subtitle"
                    data-i18n="subtitle"
                >
                    Login to manage your procurement
                </p>


                <!-- SERVER MESSAGE -->

                <div
                    id="serverMessage"
                    class="server-message"
                ></div>


                <form id="loginForm">


                    <!-- MOBILE -->

                    <div class="input-group">

                        <label
                            for="mobile"
                            data-i18n="mobileLabel"
                        >
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="mobile"
                            placeholder="Enter 10-digit mobile number"
                            maxlength="10"
                            autocomplete="tel"
                        >

                        <span
                            class="error"
                            id="mobileError"
                        ></span>

                    </div>


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label
                            for="password"
                            data-i18n="passwordLabel"
                        >
                            Password
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                            >

                            <button
                                type="button"
                                class="show-password"
                                id="showPassword"
                                data-i18n="show"
                            >
                                Show
                            </button>

                        </div>

                        <span
                            class="error"
                            id="passwordError"
                        ></span>

                    </div>


                    <!-- OPTIONS -->

                    <div class="options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="remember"
                            >

                            <span data-i18n="remember">
                                Remember me
                            </span>

                        </label>


                        <a
                            href="#"
                            class="forgot"
                            onclick="return false;"
                            data-i18n="forgot"
                        >
                            Forgot Password?
                        </a>

                    </div>


                    <!-- LOGIN -->

                    <button
                        type="submit"
                        class="login-btn"
                        id="loginButton"
                        data-i18n="login"
                    >
                        Login
                    </button>

                </form>


                <!-- REGISTER -->

                <div class="register">

                    <span data-i18n="noAccount">
                        Don't have an account?
                    </span>

                    <a href="register.html">
                        <span data-i18n="register">
                            Register as Farmer
                        </span>
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =====================================
           API
        ===================================== */

        const API =
            "https://talented-smile-production-e2fa.up.railway.app";


        /* =====================================
           ELEMENTS
        ===================================== */

        const form =
            document.getElementById("loginForm");

        const mobile =
            document.getElementById("mobile");

        const password =
            document.getElementById("password");

        const mobileError =
            document.getElementById("mobileError");

        const passwordError =
            document.getElementById("passwordError");

        const showPassword =
            document.getElementById("showPassword");

        const loginButton =
            document.getElementById("loginButton");

        const serverMessage =
            document.getElementById("serverMessage");


        /* =====================================
           LANGUAGE
        ===================================== */

        const translations = {

            en: {

                heroTitle:
                    "Smart Procurement.<br>Better Farming.",

                heroText:
                    "Book your procurement slot, track your queue and manage your procurement easily.",

                welcome:
                    "Welcome Back!",

                subtitle:
                    "Login to manage your procurement",

                mobileLabel:
                    "Mobile Number",

                passwordLabel:
                    "Password",

                mobilePlaceholder:
                    "Enter 10-digit mobile number",

                passwordPlaceholder:
                    "Enter your password",

                show:
                    "Show",

                hide:
                    "Hide",

                remember:
                    "Remember me",

                forgot:
                    "Forgot Password?",

                login:
                    "Login",

                loggingIn:
                    "Logging in...",

                noAccount:
                    "Don't have an account?",

                register:
                    "Register as Farmer",

                mobileRequired:
                    "Please enter your mobile number.",

                mobileInvalid:
                    "Enter a valid 10-digit number.",

                passwordRequired:
                    "Please enter your password.",

                connectionError:
                    "Unable to connect to server. Please try again.",

                loginSuccess:
                    "Login successful. Redirecting..."

            },


            hi: {

                heroTitle:
                    "स्मार्ट खरीद।<br>बेहतर खेती।",

                heroText:
                    "अपना खरीद स्लॉट बुक करें, अपनी कतार ट्रैक करें और अपनी खरीदारी आसानी से प्रबंधित करें।",

                welcome:
                    "वापसी पर स्वागत है!",

                subtitle:
                    "अपनी खरीदारी प्रबंधित करने के लिए लॉगिन करें",

                mobileLabel:
                    "मोबाइल नंबर",

                passwordLabel:
                    "पासवर्ड",

                mobilePlaceholder:
                    "10 अंकों का मोबाइल नंबर दर्ज करें",

                passwordPlaceholder:
                    "अपना पासवर्ड दर्ज करें",

                show:
                    "दिखाएँ",

                hide:
                    "छिपाएँ",

                remember:
                    "मुझे याद रखें",

                forgot:
                    "पासवर्ड भूल गए?",

                login:
                    "लॉगिन",

                loggingIn:
                    "लॉगिन हो रहा है...",

                noAccount:
                    "खाता नहीं है?",

                register:
                    "किसान के रूप में रजिस्टर करें",

                mobileRequired:
                    "कृपया अपना मोबाइल नंबर दर्ज करें।",

                mobileInvalid:
                    "10 अंकों का सही मोबाइल नंबर दर्ज करें।",

                passwordRequired:
                    "कृपया अपना पासवर्ड दर्ज करें।",

                connectionError:
                    "सर्वर से कनेक्ट नहीं हो पाया। कृपया फिर से प्रयास करें।",

                loginSuccess:
                    "लॉगिन सफल। रीडायरेक्ट किया जा रहा है..."

            },


            gu: {

                heroTitle:
                    "સ્માર્ટ ખરીદી.<br>વધુ સારી ખેતી.",

                heroText:
                    "તમારો ખરીદી સ્લોટ બુક કરો, તમારી કતાર ટ્રેક કરો અને તમારી ખરીદી સરળતાથી મેનેજ કરો.",

                welcome:
                    "ફરી સ્વાગત છે!",

                subtitle:
                    "તમારી ખરીદી મેનેજ કરવા માટે લોગિન કરો",

                mobileLabel:
                    "મોબાઇલ નંબર",

                passwordLabel:
                    "પાસવર્ડ",

                mobilePlaceholder:
                    "10 અંકનો મોબાઇલ નંબર દાખલ કરો",

                passwordPlaceholder:
                    "તમારો પાસવર્ડ દાખલ કરો",

                show:
                    "બતાવો",

                hide:
                    "છુપાવો",

                remember:
                    "મને યાદ રાખો",

                forgot:
                    "પાસવર્ડ ભૂલી ગયા?",

                login:
                    "લોગિન",

                loggingIn:
                    "લોગિન થઈ રહ્યું છે...",

                noAccount:
                    "એકાઉન્ટ નથી?",

                register:
                    "ખેડૂત તરીકે રજીસ્ટર કરો",

                mobileRequired:
                    "કૃપા કરીને તમારો મોબાઇલ નંબર દાખલ કરો.",

                mobileInvalid:
                    "યોગ્ય 10 અંકનો મોબાઇલ નંબર દાખલ કરો.",

                passwordRequired:
                    "કૃપા કરીને તમારો પાસવર્ડ દાખલ કરો.",

                connectionError:
                    "સર્વર સાથે કનેક્ટ થઈ શક્યું નથી. ફરી પ્રયાસ કરો.",

                loginSuccess:
                    "લોગિન સફળ. રીડાયરેક્ટ થઈ રહ્યું છે..."

            }

        };


        /* =====================================
           APPLY LANGUAGE
        ===================================== */

        function applyLanguage(language) {

            const lang =
                translations[language]
                    ? language
                    : "en";

            localStorage.setItem(
                "kisanSetuLanguage",
                lang
            );

            document.getElementById(
                "languageSelect"
            ).value = lang;

            document
                .querySelectorAll("[data-i18n]")
                .forEach(element => {

                    const key =
                        element.getAttribute("data-i18n");

                    if (translations[lang][key]) {

                        element.innerHTML =
                            translations[lang][key];

                    }

                });


            mobile.placeholder =
                translations[lang].mobilePlaceholder;

            password.placeholder =
                translations[lang].passwordPlaceholder;


            if (showPassword.dataset.mode === "hide") {

                showPassword.textContent =
                    translations[lang].hide;

            } else {

                showPassword.textContent =
                    translations[lang].show;

            }


            document.documentElement.lang =
                lang === "hi"
                    ? "hi"
                    : lang === "gu"
                        ? "gu"
                        : "en";
        }


        /* =====================================
           SHOW / HIDE PASSWORD
        ===================================== */

        showPassword.dataset.mode = "show";

        showPassword.addEventListener(
            "click",
            function () {

                const language =
                    localStorage.getItem(
                        "kisanSetuLanguage"
                    ) || "en";

                if (password.type === "password") {

                    password.type = "text";

                    showPassword.dataset.mode =
                        "hide";

                    showPassword.textContent =
                        translations[language].hide;

                } else {

                    password.type = "password";

                    showPassword.dataset.mode =
                        "show";

                    showPassword.textContent =
                        translations[language].show;
                }

            }
        );


        /* =====================================
           ONLY ALLOW NUMBERS
        ===================================== */

        mobile.addEventListener(
            "input",
            function () {

                mobile.value =
                    mobile.value.replace(
                        /[^0-9]/g,
                        ""
                    );

            }
        );


        /* =====================================
           LOGIN
        ===================================== */

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                mobileError.textContent = "";
                passwordError.textContent = "";

                serverMessage.textContent = "";
                serverMessage.className =
                    "server-message";


                const language =
                    localStorage.getItem(
                        "kisanSetuLanguage"
                    ) || "en";


                const mobileValue =
                    mobile.value.trim();

                const passwordValue =
                    password.value.trim();


                let valid = true;


                /* MOBILE */

                if (mobileValue === "") {

                    mobileError.textContent =
                        translations[language].mobileRequired;

                    valid = false;

                }

                else if (
                    !/^[0-9]{10}$/.test(
                        mobileValue
                    )
                ) {

                    mobileError.textContent =
                        translations[language].mobileInvalid;

                    valid = false;

                }


                /* PASSWORD */

                if (passwordValue === "") {

                    passwordError.textContent =
                        translations[language].passwordRequired;

                    valid = false;

                }


                if (!valid) {
                    return;
                }


                /* =========================
                   DATABASE LOGIN
                ========================== */

                loginButton.disabled = true;

                loginButton.textContent =
                    translations[language].loggingIn;


                try {

                    const response =
                        await fetch(
                            `${API}/api/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    mobile:
                                        mobileValue,

                                    password:
                                        passwordValue

                                })

                            }
                        );


                    let data = {};

                    try {

                        data =
                            await response.json();

                    } catch (jsonError) {

                        data = {};

                    }


                    /* LOGIN FAILED */

                    if (!response.ok) {

                        passwordError.textContent =
                            data.message ||
                            "Invalid mobile number or password.";

                        loginButton.disabled = false;

                        loginButton.textContent =
                            translations[language].login;

                        return;
                    }


                    /* =========================
                       SAVE FARMER
                    ========================== */

                    if (!data.farmer) {

                        throw new Error(
                            "Farmer information was not returned by server."
                        );

                    }


                    localStorage.setItem(
                        "farmer",
                        JSON.stringify(
                            data.farmer
                        )
                    );


                    localStorage.setItem(
                        "kisanSetuLoggedIn",
                        "true"
                    );


                    /* REMEMBER ME */

                    if (
                        document.getElementById(
                            "remember"
                        ).checked
                    ) {

                        localStorage.setItem(
                            "kisanSetuRememberMe",
                            "true"
                        );

                    } else {

                        localStorage.removeItem(
                            "kisanSetuRememberMe"
                        );

                    }


                    /* SUCCESS */

                    serverMessage.className =
                        "server-message success-message";

                    serverMessage.textContent =
                        translations[language].loginSuccess;


                    /* =========================
                       GO TO DASHBOARD
                    ========================== */

                    setTimeout(
                        function () {

                            window.location.href =
                                "dashboard.html";

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    serverMessage.className =
                        "server-message error-message";

                    serverMessage.textContent =
                        translations[language].connectionError;


                    loginButton.disabled = false;

                    loginButton.textContent =
                        translations[language].login;

                }

            }
        );


        /* =====================================
           START
        ===================================== */

        const savedLanguage =
            localStorage.getItem(
                "kisanSetuLanguage"
            ) || "en";


        applyLanguage(
            savedLanguage
        );

    </script>

</body>

</html>
