<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Kisan Setu - Book Procurement Slot
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f3f8f3;
            color: #173f2a;
            min-height: 100vh;
        }


        /* TOP BAR */

        .top-bar {
            height: 34px;
            background: #176b3a;
        }


        /* HEADER */

        header {
            text-align: center;
            padding: 48px 20px 35px;
        }


        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }


        header h1 span {
            color: #ff3d81;
        }


        header p {
            color: #536779;
            font-size: 20px;
        }


        /* CONTAINER */

        .container {
            width: 94%;
            max-width: 1200px;
            margin: auto;
        }


        /* SECTION */

        .section {
            background: white;
            padding: 35px;
            border-radius: 24px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }


        .section h2 {
            font-size: 30px;
            color: #08733d;
            margin-bottom: 25px;
        }


        /* CENTRES */

        .centre-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }


        .centre-card {
            border: 2px solid #e1e9e2;
            border-radius: 16px;
            padding: 22px;
            cursor: pointer;
            transition: 0.2s;
        }


        .centre-card:hover {
            border-color: #168149;
            transform: translateY(-2px);
        }


        .centre-card.selected {
            border-color: #168149;
            background: #eef9f1;
        }


        .centre-card h3 {
            color: #176b3a;
            font-size: 21px;
            margin-bottom: 10px;
        }


        .centre-card p {
            margin: 7px 0;
            color: #596b62;
        }



        /* CROP SELECTION */

        .crop-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 5px;
        }

        .crop-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .crop-field label {
            font-weight: bold;
            color: #176b3a;
        }

        .crop-field select {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #e0e8e1;
            border-radius: 12px;
            background: white;
            color: #173f2a;
            font-size: 16px;
            outline: none;
        }

        .crop-field select:focus {
            border-color: #168149;
        }

        .readonly-field {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #e0e8e1;
            border-radius: 12px;
            background: #f4f8f5;
            color: #173f2a;
            font-size: 16px;
            outline: none;
            cursor: not-allowed;
            font-weight: 600;
        }

        .crop-info {
            margin-top: 15px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #eef9f1;
            color: #176b3a;
            display: none;
            line-height: 1.6;
        }

        @media (max-width: 850px) {
            .crop-selection {
                grid-template-columns: 1fr;
            }
        }

        /* SLOTS */

        .slot-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }


        .slot-card {
            border: 2px solid #e0e8e1;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: 0.2s;
        }


        .slot-card:hover {
            border-color: #168149;
            transform: translateY(-2px);
        }


        .slot-card.selected {
            background: #eef9f1;
            border-color: #168149;
        }


        .slot-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


        .slot-card h3 {
            color: #176b3a;
            margin-bottom: 8px;
        }


        .available {
            color: #168149;
            font-weight: bold;
            margin-top: 8px;
        }


        .full {
            color: #d63b3b;
            font-weight: bold;
            margin-top: 8px;
        }


        /* BUTTON */

        .book-btn {
            width: 100%;
            margin-top: 25px;
            padding: 17px;
            border: none;
            border-radius: 13px;
            background: #176b3a;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }


        .book-btn:hover:not(:disabled) {
            background: #0e542c;
        }


        .book-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }


        /* MESSAGE */

        #message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
            line-height: 1.7;
        }


        .success {
            display: block !important;
            background: #e4f7e9;
            color: #176b3a;
        }


        .error {
            display: block !important;
            background: #ffe8e8;
            color: #b42323;
        }


        /* BACK */

        .back {
            text-align: center;
            padding: 10px 0 40px;
        }


        .back a {
            color: #176b3a;
            font-weight: bold;
            text-decoration: none;
        }


        .back a:hover {
            text-decoration: underline;
        }


        /* MOBILE */

        @media (max-width: 850px) {

            header h1 {
                font-size: 32px;
            }


            .centre-grid {
                grid-template-columns: 1fr;
            }


            .slot-grid {
                grid-template-columns: 1fr;
            }


            .section {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <div class="top-bar"></div>


    <header>

        <h1>

            <span>🎟️</span>

            Book Procurement Slot

        </h1>


        <p>
            Select your preferred procurement centre and time slot.
        </p>

    </header>



    <div class="container">


        <!-- ========================================= -->
        <!-- CENTRES -->
        <!-- ========================================= -->

        <div class="section">

            <h2>
                📍 Procurement Centre
            </h2>


            <div
                id="centresContainer"
                class="centre-grid"
            >

                <p>
                    Loading centres...
                </p>

            </div>

        </div>




        <!-- ========================================= -->
        <!-- CROP SELECTION -->
        <!-- ========================================= -->

        <div class="section">

            <h2>
                🌾 Select Crop
            </h2>

            <div class="crop-selection">

                <div class="crop-field">

                    <label for="cropSelect">
                        Crop
                    </label>

                    <select id="cropSelect" onchange="selectCrop()">
                        <option value="">
                            Select your crop
                        </option>
                    </select>

                </div>

                <div class="crop-field">

                    <label for="varietySelect">
                        Crop Variety
                    </label>

                    <select id="varietySelect" onchange="selectVariety()" disabled>
                        <option value="">
                            Select crop first
                        </option>
                    </select>

                </div>

                <div class="crop-field">

                    <label for="quantityDisplay">
                        Booking Quantity
                    </label>

                    <input
                        id="quantityDisplay"
                        type="number"
                        value=""
                        min="0.01"
                        step="0.01"
                        placeholder="Enter quantity"
                    >

                    <small id="availableQuantity" class="field-hint">
                        Select a crop to see available quantity.
                    </small>

                </div>

                <div class="crop-field">

                    <label for="unitDisplay">
                        Unit
                    </label>

                    <input
                        id="unitDisplay"
                        type="text"
                        value="--"
                        readonly
                        class="readonly-field"
                    >

                </div>

            </div>

            <div id="cropInfo" class="crop-info"></div>

        </div>


        <!-- ========================================= -->
        <!-- SLOTS -->
        <!-- ========================================= -->

        <div class="section">

            <h2>
                🕒 Available Slots
            </h2>


            <div
                id="slotsContainer"
                class="slot-grid"
            >

                <p>
                    Please select a procurement centre first.
                </p>

            </div>


            <button
                id="bookButton"
                class="book-btn"
                disabled
                onclick="bookSlot()"
            >
                🎟️ Book Selected Slot
            </button>


            <div id="message"></div>

        </div>



        <!-- ========================================= -->
        <!-- BACK -->
        <!-- ========================================= -->

        <div class="back">

            <a href="dashboard.html">
                ← Back to Dashboard
            </a>

        </div>

    </div>



<script>


    // ==================================================
    // BACKEND
    // ==================================================

    const API = "https://talented-smile-production-e2fa.up.railway.app";



    // ==================================================
    // CHECK LOGIN
    // ==================================================

    const farmerData =
        localStorage.getItem("farmer");


    if (!farmerData) {

        alert(
            "Please login first."
        );

        window.location.href =
            "login.html";

    }


    const farmer =
        JSON.parse(farmerData);


    const farmerId =
        farmer.id;



    // ==================================================
    // VARIABLES
    // ==================================================

    let centres = [];

    let slots = [];

    let crops = [];

    let selectedCentreId = null;

    let selectedSlotId = null;

    let selectedCropId = null;

    let selectedCropVariety = null;

    let bookingInProgress = false;

    // Common varieties shown according to the selected crop.
    const cropVarieties = {
        wheat: [
            "Lokwan",
            "Sharbati",
            "Durum"
        ],
        soybean: [
            "JS 335",
            "JS 9560",
            "NRC 37"
        ],
        mustard: [
            "Pusa Bold",
            "Varuna",
            "Giriraj"
        ],
        gram: [
            "JG 11",
            "JG 14",
            "JG 16"
        ],
        maize: [
            "Pioneer 3396",
            "HQPM 1",
            "DHM 117"
        ],
        rice: [
            "Basmati 1121",
            "IR64",
            "Pusa Basmati 1509"
        ],
        cotton: [
            "Bt Cotton",
            "Desi Cotton"
        ],
        potato: [
            "Kufri Jyoti",
            "Kufri Pukhraj",
            "Kufri Badshah"
        ],
        onion: [
            "N-53",
            "Bhima Super",
            "Bhima Kiran"
        ]
    };



    // ==================================================
    // LOAD FARMER CROPS
    // ==================================================

    async function loadCrops() {

        const select =
            document.getElementById("cropSelect");

        try {

            const response =
                await fetch(
                    `${API}/api/crops/${farmerId}`
                );

            if (!response.ok) {
                throw new Error("Unable to load crops");
            }

            crops = await response.json();

            select.innerHTML =
                '<option value="">Select your crop</option>';

            if (crops.length === 0) {

                select.innerHTML =
                    '<option value="">No crop added yet</option>';

                document.getElementById(
                    "varietySelect"
                ).disabled = true;

                return;
            }

            crops.forEach(crop => {

                const option =
                    document.createElement("option");

                option.value = crop.id;

                option.textContent = crop.crop_name;

                select.appendChild(option);

            });

        } catch (error) {

            console.error(
                "Crop Error:",
                error
            );

            select.innerHTML =
                '<option value="">Unable to load crops</option>';

        }

    }


    // ==================================================
    // SELECT CROP
    // ==================================================

    function selectCrop() {

        const cropId =
            document.getElementById("cropSelect").value;

        const varietySelect =
            document.getElementById("varietySelect");

        const cropInfo =
            document.getElementById("cropInfo");

        selectedCropId =
            cropId ? Number(cropId) : null;

        selectedCropVariety = null;

        varietySelect.innerHTML =
            '<option value="">Select variety</option>';

        varietySelect.disabled =
            !selectedCropId;

        cropInfo.style.display =
            "none";

        document.getElementById("quantityDisplay").value = "";
        document.getElementById("quantityDisplay").removeAttribute("max");
        document.getElementById("availableQuantity").textContent =
            "Select a crop to see available quantity.";
        document.getElementById("unitDisplay").value = "--";

        if (!selectedCropId) {
            updateBookButton();
            return;
        }

        const crop =
            crops.find(
                item =>
                    Number(item.id) === selectedCropId
            );

        if (!crop) {
            updateBookButton();
            return;
        }

        const key =
            String(crop.crop_name)
                .trim()
                .toLowerCase();

        let varieties =
            cropVarieties[key] || [];

        // If a saved variety exists and is not in the
        // standard list, keep it available too.
        if (
            crop.crop_variety &&
            !varieties.includes(crop.crop_variety)
        ) {
            varieties = [
                crop.crop_variety,
                ...varieties
            ];
        }

        if (varieties.length === 0) {
            varieties = ["Other"];
        }

        varieties.forEach(
            variety => {

                const option =
                    document.createElement("option");

                option.value = variety;
                option.textContent = variety;

                varietySelect.appendChild(option);

            }
        );

        const quantity = Number(crop.quantity);
        const unit = crop.unit || "kg";

        const quantityInput =
            document.getElementById("quantityDisplay");

        if (Number.isFinite(quantity) && quantity > 0) {
            quantityInput.value = "";
            quantityInput.max = quantity;
            document.getElementById("availableQuantity").textContent =
                `Available: ${quantity.toFixed(2)} ${unit}`;
        } else {
            quantityInput.value = "";
            document.getElementById("availableQuantity").textContent =
                "Available quantity not available.";
        }

        document.getElementById("unitDisplay").value = unit;

        cropInfo.innerHTML =
            `<strong>${crop.crop_name}</strong> · Available: ${Number.isFinite(quantity) ? quantity.toFixed(2) : "--"} ${unit}`;

        cropInfo.style.display =
            "block";

        updateBookButton();

    }


    // ==================================================
    // SELECT VARIETY
    // ==================================================

    function selectVariety() {

        selectedCropVariety =
            document.getElementById(
                "varietySelect"
            ).value || null;

        updateBookButton();

    }


    // ==================================================
    // UPDATE BOOK BUTTON
    // ==================================================

    function updateBookButton() {

        const button =
            document.getElementById("bookButton");

        button.disabled =
            !selectedCentreId ||
            !selectedSlotId ||
            !selectedCropId ||
            !selectedCropVariety;

    }


    // ==================================================
    // LOAD CENTRES
    // ==================================================

    async function loadCentres() {

        const container =
            document.getElementById(
                "centresContainer"
            );


        try {

            const response =
                await fetch(
                    `${API}/api/centres`
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load centres"
                );

            }


            centres =
                await response.json();


            container.innerHTML =
                "";


            if (centres.length === 0) {

                container.innerHTML =
                    "<p>No procurement centres available.</p>";

                return;

            }


            centres.forEach(
                centre => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "centre-card";


                    card.innerHTML = `

                        <h3>
                            📍 ${centre.name}
                        </h3>

                        <p>
                            Location:
                            ${centre.location}
                        </p>

                        <p>
                            Capacity:
                            ${centre.capacity}
                        </p>

                    `;


                    card.onclick =
                        function() {

                            selectCentre(
                                centre.id,
                                card
                            );

                        };


                    container.appendChild(
                        card
                    );

                }
            );


        } catch (error) {

            console.error(
                "Centre Error:",
                error
            );


            container.innerHTML = `

                <p style="color:red;">

                    Unable to load centres.

                    <br>

                    Please make sure backend is running.

                </p>

            `;

        }

    }



    // ==================================================
    // SELECT CENTRE
    // ==================================================

    function selectCentre(
        centreId,
        card
    ) {

        selectedCentreId =
            centreId;


        selectedSlotId =
            null;


        document
            .querySelectorAll(
                ".centre-card"
            )
            .forEach(
                c => {

                    c.classList.remove(
                        "selected"
                    );

                }
            );


        card.classList.add(
            "selected"
        );


        updateBookButton();


        clearMessage();


        loadSlots();

    }



    // ==================================================
    // LOAD SLOTS
    // ==================================================

    async function loadSlots() {

        const container =
            document.getElementById(
                "slotsContainer"
            );


        container.innerHTML =
            "<p>Loading slots...</p>";


        try {

            const response =
                await fetch(
                    `${API}/api/slots`
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load slots"
                );

            }


            const allSlots =
                await response.json();


            slots =
                allSlots.filter(
                    slot =>
                        Number(
                            slot.centre_id
                        ) ===
                        Number(
                            selectedCentreId
                        )
                );


            container.innerHTML =
                "";


            if (slots.length === 0) {

                container.innerHTML =
                    "<p>No slots available for this centre.</p>";

                return;

            }


            slots.forEach(
                slot => {


                    const capacity =
                        Number(
                            slot.capacity
                        );


                    const booked =
                        Number(
                            slot.booked_count
                        );


                    const available =
                        Math.max(
                            0,
                            capacity - booked
                        );


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "slot-card";


                    if (available <= 0) {

                        card.classList.add(
                            "disabled"
                        );

                    }


                    card.innerHTML = `

                        <h3>
                            🕒
                            ${formatDate(
                                slot.slot_date
                            )}
                        </h3>

                        <p>
                            ${formatTime(
                                slot.start_time
                            )}

                            -

                            ${formatTime(
                                slot.end_time
                            )}
                        </p>

                        <p>
                            Capacity:
                            ${capacity}
                        </p>

                        <p>
                            Booked:
                            ${booked}
                        </p>

                        ${
                            available > 0

                            ?

                            `
                            <p class="available">
                                ${available}
                                slots available
                            </p>
                            `

                            :

                            `
                            <p class="full">
                                Slot Full
                            </p>
                            `
                        }

                    `;


                    if (available > 0) {

                        card.onclick =
                            function() {

                                selectSlot(
                                    slot.id,
                                    card
                                );

                            };

                    }


                    container.appendChild(
                        card
                    );

                }
            );


        } catch (error) {

            console.error(
                "Slot Error:",
                error
            );


            container.innerHTML = `

                <p style="color:red;">

                    Unable to load slots.

                    <br>

                    Please make sure backend is running.

                </p>

            `;

        }

    }



    // ==================================================
    // SELECT SLOT
    // ==================================================

    function selectSlot(
        slotId,
        card
    ) {

        selectedSlotId =
            slotId;


        document
            .querySelectorAll(
                ".slot-card"
            )
            .forEach(
                c => {

                    c.classList.remove(
                        "selected"
                    );

                }
            );


        card.classList.add(
            "selected"
        );


        updateBookButton();


        clearMessage();

    }



    // ==================================================
    // BOOK SLOT
    // ==================================================

    async function bookSlot() {


        if (bookingInProgress) {

            return;

        }


        if (
            !selectedCropId ||
            !selectedCropVariety ||
            !selectedCentreId ||
            !selectedSlotId ||
            !Number(document.getElementById("quantityDisplay").value)
        ) {

            showMessage(
                "Please select crop, crop variety, centre and slot.",
                "error"
            );

            return;

        }


        const button =
            document.getElementById(
                "bookButton"
            );


        bookingInProgress =
            true;


        button.disabled =
            true;


        button.textContent =
            "Booking...";


        clearMessage();


        try {


            // =========================================
            // SEND BOOKING REQUEST
            // =========================================

            const response =
                await fetch(
                    `${API}/api/bookings`,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                farmer_id:
                                    farmerId,

                                crop_id:
                                    selectedCropId,

                                crop_variety:
                                    selectedCropVariety,

                                quantity:
                                    Number(document.getElementById("quantityDisplay").value),

                                centre_id:
                                    selectedCentreId,

                                slot_id:
                                    selectedSlotId

                            })

                    }
                );


            // =========================================
            // READ RESPONSE SAFELY
            // =========================================

            let data = {};

            try {

                data =
                    await response.json();

            } catch {

                data = {};

            }


            // =========================================
            // BACKEND ERROR
            // =========================================

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    `Booking failed (${response.status})`
                );

            }


            // =========================================
            // SUCCESS
            // =========================================

            showMessage(

                `
                    🎉 Slot booked successfully!

                    <br><br>

                    🎟️ Token:
                    <strong>
                        ${data.token_number}
                    </strong>

                    <br>

                    📊 Queue Position:
                    <strong>
                        ${data.position}
                    </strong>

                    <br>

                    ⏳ Estimated Wait:
                    <strong>
                        ${data.estimated_wait}
                        minutes
                    </strong>

                `,

                "success"

            );


            button.textContent =
                "Slot Booked ✓";


            // =========================================
            // GO TO DASHBOARD
            // =========================================

            setTimeout(
                function() {

                    window.location.href =
                        "dashboard.html";

                },
                2000
            );


        } catch (error) {

            console.error(
                "Booking Error:",
                error
            );


            showMessage(

                "❌ " +
                error.message,

                "error"

            );


            bookingInProgress =
                false;


            button.disabled =
                false;


            button.textContent =
                "🎟️ Book Selected Slot";

        }

    }



    // ==================================================
    // SHOW MESSAGE
    // ==================================================

    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.innerHTML =
            text;


        message.className =
            type;

    }



    // ==================================================
    // CLEAR MESSAGE
    // ==================================================

    function clearMessage() {

        const message =
            document.getElementById(
                "message"
            );


        message.innerHTML =
            "";


        message.className =
            "";

    }



    // ==================================================
    // FORMAT DATE
    // ==================================================

    function formatDate(
        dateString
    ) {

        const date =
            new Date(
                dateString
            );


        return date.toLocaleDateString(
            "en-IN",
            {

                day: "numeric",

                month: "short",

                year: "numeric"

            }
        );

    }



    // ==================================================
    // FORMAT TIME
    // ==================================================

    function formatTime(
        time
    ) {

        if (!time) {

            return "";

        }


        const parts =
            time.split(":");


        let hour =
            parseInt(
                parts[0]
            );


        const minute =
            parts[1];


        const ampm =
            hour >= 12
                ? "PM"
                : "AM";


        hour =
            hour % 12 || 12;


        return `${hour}:${minute} ${ampm}`;

    }

    loadCrops();

    loadCentres();

</script>
