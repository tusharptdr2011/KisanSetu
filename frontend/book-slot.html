<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kisan Setu - Book Procurement Slot</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f3f8f3;
            color: #173f2a;
            min-height: 100vh;
        }


        /* TOP BAR */

        .top-bar {
            height: 34px;
            background: #176b3a;
        }


        /* HEADER */

        header {
            text-align: center;
            padding: 48px 20px 35px;
        }


        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }


        header h1 span {
            color: #ff3d81;
        }


        header p {
            color: #536779;
            font-size: 20px;
        }


        /* CONTAINER */

        .container {
            width: 94%;
            max-width: 1200px;
            margin: auto;
        }


        /* SECTION */

        .section {
            background: white;
            padding: 35px;
            border-radius: 24px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }


        .section h2 {
            font-size: 30px;
            color: #08733d;
            margin-bottom: 25px;
        }


        /* CENTRES */

        .centre-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }


        .centre-card {
            border: 2px solid #e1e9e2;
            border-radius: 16px;
            padding: 22px;
            cursor: pointer;
            transition: 0.2s;
        }


        .centre-card:hover {
            border-color: #168149;
            transform: translateY(-2px);
        }


        .centre-card.selected {
            border-color: #168149;
            background: #eef9f1;
        }


        .centre-card h3 {
            color: #176b3a;
            font-size: 21px;
            margin-bottom: 10px;
        }


        .centre-card p {
            margin: 7px 0;
            color: #596b62;
        }


        /* SLOTS */

        .slot-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }


        .slot-card {
            border: 2px solid #e0e8e1;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: 0.2s;
        }


        .slot-card:hover {
            border-color: #168149;
            transform: translateY(-2px);
        }


        .slot-card.selected {
            background: #eef9f1;
            border-color: #168149;
        }


        .slot-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


        .slot-card h3 {
            color: #176b3a;
            margin-bottom: 8px;
        }


        .available {
            color: #168149;
            font-weight: bold;
            margin-top: 8px;
        }


        .full {
            color: #d63b3b;
            font-weight: bold;
            margin-top: 8px;
        }


        /* BUTTON */

        .book-btn {
            width: 100%;
            margin-top: 25px;
            padding: 17px;
            border: none;
            border-radius: 13px;
            background: #176b3a;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }


        .book-btn:hover:not(:disabled) {
            background: #0e542c;
        }


        .book-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }


        /* MESSAGE */

        #message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
            line-height: 1.7;
        }


        .success {
            display: block !important;
            background: #e4f7e9;
            color: #176b3a;
        }


        .error {
            display: block !important;
            background: #ffe8e8;
            color: #b42323;
        }


        /* BACK */

        .back {
            text-align: center;
            padding: 10px 0 40px;
        }


        .back a {
            color: #176b3a;
            font-weight: bold;
            text-decoration: none;
        }


        .back a:hover {
            text-decoration: underline;
        }


        /* MOBILE */

        @media (max-width: 850px) {

            header h1 {
                font-size: 32px;
            }


            .centre-grid {
                grid-template-columns: 1fr;
            }


            .slot-grid {
                grid-template-columns: 1fr;
            }


            .section {
                padding: 25px;
            }

        }


        /* ================= LANGUAGE SELECTOR ================= */
        .crop-select,
        #bookingQuantity,
        #unitDisplay {
            width: 100%;
            padding: 13px 14px;
            margin-top: 8px;
            border: 1px solid #d5e2d8;
            border-radius: 10px;
            background: white;
            color: #173f2a;
            font-size: 16px;
            outline: none;
        }

        .crop-select:focus,
        #bookingQuantity:focus,
        #unitDisplay:focus {
            border-color: #168149;
        }

        label {
            display: block;
            margin-top: 8px;
            font-weight: 700;
            color: #176b3a;
        }

        .available-quantity {
            margin-top: 10px;
            color: #168149;
            font-weight: 700;
        }

        .quantity-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .quantity-error {
            color: #b42323;
            font-weight: 700;
            margin-top: 8px;
        }

        @media (max-width: 600px) {
            .quantity-row {
                grid-template-columns: 1fr;
            }
        }

        .language-select {
            border: 1px solid #17623d;
            background: white;
            color: #17623d;
            padding: 9px 11px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            font-size: 12px;
        }
        .language-select option {
            color: #173b2b;
            background: white;
        }

.location-selection-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}
.location-field{
    min-width:0;
}
.location-full{
    grid-column:1 / -1;
}
.location-field .crop-select{
    cursor:pointer;
}
.location-field .crop-select:disabled{
    cursor:not-allowed;
    opacity:.72;
    background:#f2f6f3!important;
}

<body>


    <div class="top-bar"></div>


    <header>

        <h1>

            <span>🎟️</span>

            <span data-i18n="title">Book Procurement Slot</span>

        </h1>


        <p data-i18n="subtitle">
            Select your preferred procurement centre and time slot.
        </p>

        <select id="languageSelect" class="language-select" aria-label="Language"
                onchange="applyLanguage(this.value)">
            <option value="en">🌐 English</option>
            <option value="hi">🇮🇳 हिन्दी</option>
            <option value="gu">🇮🇳 ગુજરાતી</option>
        </select>

    </header>



    <div class="container">


        <!-- ========================================= -->
        <!-- CENTRES -->
        <!-- ========================================= -->

        <div class="section">

           <h2 data-i18n="cropDetails">🌾 Crop Details</h2>

<div class="crop-selection-grid">

    <div>
        <label data-i18n="selectCrop">Select Crop</label>

        <select
            id="cropSelect"
            class="crop-select"
            onchange="selectCrop()"
            required
        >
            <option value="" data-i18n="chooseCrop">
                Choose a crop
            </option>
        </select>
    </div>

    <div>
        <label data-i18n="cropVariety">Crop Variety</label>

        <select
            id="cropVariety"
            class="crop-select"
            onchange="selectVariety()"
            required
            disabled
        >
            <option value="" data-i18n="chooseVariety">
                Choose a variety
            </option>
        </select>

        <small
            id="varietyHint"
            style="display:block;margin-top:7px;color:var(--muted);font-size:12px;"
        >
            Select a crop to see available varieties.
        </small>
    </div>

</div>

            <p id="availableQuantity" class="available-quantity"></p>

            <div class="quantity-row">
                <div>
                    <label data-i18n="bookingQuantity">Booking Quantity</label>
                    <input id="bookingQuantity" type="number" min="0.01" step="0.01"
                           placeholder="Enter quantity" oninput="validateBookingQuantity()" required>
                </div>
                <div>
                    <label data-i18n="unit">Unit</label>
                    <select id="unitDisplay" onchange="changeBookingUnit()" required>
                        <option value="kg">kg</option>
                        <option value="quintal">Quintal</option>
                        <option value="ton">Ton</option>
                    </select>
                </div>
            </div>

            <p id="quantityError" class="quantity-error"></p>
        </div>

        <div class="section">

            <h2>
                <span data-i18n="centreTitle">📍 Procurement Location</span>
            </h2>

            <div class="location-selection-grid">

                <div class="location-field">
                    <label for="stateSelect" data-i18n="state">
                        State
                    </label>

                    <select
                        id="stateSelect"
                        class="crop-select"
                        onchange="selectState()"
                        required
                    >
                        <option value="" data-i18n="chooseState">
                            Select State
                        </option>
                    </select>
                </div>

                <div class="location-field">
                    <label for="centreSelect" data-i18n="procurementCentre">
                        Procurement Centre
                    </label>

                    <select
                        id="centreSelect"
                        class="crop-select"
                        onchange="selectCentreFromDropdown()"
                        disabled
                        required
                    >
                        <option value="" data-i18n="chooseCentre">
                            Select Procurement Centre
                        </option>
                    </select>
                </div>

            </div>

            <div id="centresContainer" class="centre-grid" style="display:none;"></div>

        </div>



        <!-- ========================================= -->
        <!-- SLOTS -->
        <!-- ========================================= -->

        <div class="section">

            <h2>
                <span data-i18n="slotsTitle">🕒 Available Slots</span>
            </h2>


            <div
                id="slotsContainer"
                class="slot-grid"
            >

                <p>
                    Please select a procurement centre first.
                </p>

            </div>


            <button
                id="bookButton"
                class="book-btn"
                disabled
                onclick="bookSlot()"
            >
                <span data-i18n="bookButton">🎟️ Book Selected Slot</span>
            </button>


            <div id="message"></div>

        </div>



        <!-- ========================================= -->
        <!-- BACK -->
        <!-- ========================================= -->

        <div class="back">

            <a href="dashboard.html">
                <span data-i18n="backDashboard">← Back to Dashboard</span>
            </a>

        </div>

    </div>



<script>


    // ==================================================
    // BACKEND
    // ==================================================

    const API =
        "https://talented-smile-production-e2fa.up.railway.app";



    // ==================================================
    // CHECK LOGIN
    // ==================================================

    const farmerData =
        localStorage.getItem("farmer");


    if (!farmerData) {

        alert(
            "Please login first."
        );

        window.location.href =
            "login.html";

    }


    const farmer =
        JSON.parse(farmerData);


    const farmerId =
        farmer.id;



    // ==================================================
    // VARIABLES
    // ==================================================

    let centres = [];
    let slots = [];
    let crops = [];

    let selectedCrop = null;
    let selectedCentreId = null;
    let selectedSlotId = null;
    let selectedState = "";

    let bookingInProgress = false;
    let currentUnit = "kg";


    // ==================================================
    // LOAD CROPS
    // ==================================================

    async function loadCrops() {
        const select = document.getElementById("cropSelect");
        const varietySelect = document.getElementById("cropVariety");

        try {
            const response = await fetch(`${API}/api/crops/${farmerId}`);

            if (!response.ok) throw new Error("Unable to load crops");

            crops = await response.json();

            select.innerHTML =
                `<option value="">${t("chooseCrop")}</option>`;

            const uniqueCropNames = [...new Set(
                crops
                    .filter(crop => Number(crop.quantity) > 0)
                    .map(crop => crop.crop_name)
            )];

            uniqueCropNames.forEach(cropName => {
                const option = document.createElement("option");
                option.value = cropName;
                option.textContent = cropName;
                select.appendChild(option);
            });

            varietySelect.innerHTML =
                `<option value="">${t("chooseVariety")}</option>`;
            varietySelect.disabled = true;

            if (uniqueCropNames.length === 0) {
                select.innerHTML =
                    `<option value="">${t("noCrops")}</option>`;
            }

        } catch (error) {
            console.error("Crop Error:", error);

            select.innerHTML =
                `<option value="">${t("cropLoadError")}</option>`;

            varietySelect.innerHTML =
                `<option value="">${t("chooseVariety")}</option>`;

            varietySelect.disabled = true;
        }
    }


    function selectCrop() {
        const cropName = document.getElementById("cropSelect").value;
        const varietySelect = document.getElementById("cropVariety");

        selectedCrop = null;
        document.getElementById("bookingQuantity").value = "";
        document.getElementById("quantityError").textContent = "";

        varietySelect.innerHTML =
            `<option value="">${t("chooseVariety")}</option>`;
        varietySelect.disabled = true;

        document.getElementById("varietyHint").textContent =
            t("varietyHint");

        if (!cropName) {
            document.getElementById("availableQuantity").textContent = "";
            return;
        }

        const varieties = crops.filter(
            crop =>
                crop.crop_name === cropName &&
                Number(crop.quantity) > 0
        );

        varieties.forEach(crop => {
            const option = document.createElement("option");
            option.value = crop.id;
            option.textContent =
                crop.crop_variety || t("standardVariety");
            varietySelect.appendChild(option);
        });

        if (varieties.length > 0) {
            varietySelect.disabled = false;

            document.getElementById("varietyHint").textContent =
                `${varieties.length} ${t("varietiesAvailable")}`;

            if (varieties.length === 1) {
                varietySelect.value = String(varieties[0].id);
                selectVariety();
            }
        }
    }


    function selectVariety() {
        const varietyId =
            Number(document.getElementById("cropVariety").value);

        selectedCrop = crops.find(
            crop =>
                Number(crop.id) === varietyId &&
                Number(crop.quantity) > 0
        ) || null;

        document.getElementById("bookingQuantity").value = "";
        document.getElementById("quantityError").textContent = "";

        if (!selectedCrop) {
            document.getElementById("availableQuantity").textContent = "";
            return;
        }

        currentUnit = "kg";
        document.getElementById("unitDisplay").value = "kg";
        updateAvailableQuantity();
    }


    function updateAvailableQuantity() {
        const el = document.getElementById("availableQuantity");

        if (!selectedCrop) {
            el.textContent = "";
            return;
        }

        const kg = Number(selectedCrop.quantity) || 0;
        const display = convertFromKg(kg, currentUnit);

        el.textContent =
            `${t("available")}: ${formatNumber(display)} ${unitLabel(currentUnit)}`;

        validateBookingQuantity();
    }


    function convertToKg(value, unit) {
        if (unit === "ton") return value * 1000;
        if (unit === "quintal") return value * 100;
        return value;
    }


    function convertFromKg(value, unit) {
        if (unit === "ton") return value / 1000;
        if (unit === "quintal") return value / 100;
        return value;
    }


    function unitLabel(unit) {
        if (unit === "quintal") return "Quintal";
        if (unit === "ton") return "Ton";
        return "kg";
    }


    function formatNumber(value) {
        return Number(value).toLocaleString("en-IN", {
            maximumFractionDigits: 2
        });
    }


    function changeBookingUnit() {
        const nextUnit =
            document.getElementById("unitDisplay").value;

        const input =
            document.getElementById("bookingQuantity");

        const oldValue = Number(input.value);

        if (oldValue > 0) {
            const kg = convertToKg(oldValue, currentUnit);
            input.value =
                Number(convertFromKg(kg, nextUnit).toFixed(2));
        }

        currentUnit = nextUnit;
        updateAvailableQuantity();
    }


    function validateBookingQuantity() {
        const input =
            document.getElementById("bookingQuantity");

        const error =
            document.getElementById("quantityError");

        if (!selectedCrop || !input.value) {
            error.textContent = "";
            return false;
        }

        const entered = Number(input.value);
        const availableKg = Number(selectedCrop.quantity);
        const enteredKg = convertToKg(entered, currentUnit);

        if (!Number.isFinite(entered) || entered <= 0) {
            error.textContent = t("invalidQuantity");
            return false;
        }

        if (enteredKg > availableKg + 0.000001) {
            error.textContent =
                `${t("maxQuantity")}: ${formatNumber(
                    convertFromKg(availableKg, currentUnit)
                )} ${unitLabel(currentUnit)}`;
            return false;
        }

        error.textContent = "";
        return true;
    }


    // ==================================================
    // LOAD STATES
    // ==================================================

    async function loadStates() {
        const stateSelect =
            document.getElementById("stateSelect");

        try {
            const response =
                await fetch(`${API}/api/centres`);

            if (!response.ok) {
                throw new Error("Unable to load centres");
            }

            const allCentres = await response.json();
            centres = allCentres;

            const states = [
                ...new Set(
                    centres
                        .map(centre => centre.state)
                        .filter(Boolean)
                )
            ].sort();

            stateSelect.innerHTML =
                `<option value="">${t("chooseState")}</option>`;

            states.forEach(state => {
                const option = document.createElement("option");
                option.value = state;
                option.textContent = state;
                stateSelect.appendChild(option);
            });

        } catch (error) {
            console.error("State Error:", error);

            stateSelect.innerHTML =
                `<option value="">${t("stateLoadError")}</option>`;
        }
    }


    // ==================================================
    // SELECT STATE
    // ==================================================

    function selectState() {
        selectedState =
            document.getElementById("stateSelect").value;

        selectedCentreId = null;
        selectedSlotId = null;

        const centreSelect =
            document.getElementById("centreSelect");

        centreSelect.innerHTML =
            `<option value="">${t("chooseCentre")}</option>`;

        centreSelect.disabled = true;

        clearSlots();

        if (!selectedState) return;

        const stateCentres =
            centres.filter(
                centre => centre.state === selectedState
            );

        stateCentres
            .sort((a, b) =>
                String(a.name).localeCompare(String(b.name))
            )
            .forEach(centre => {
                const option = document.createElement("option");
                option.value = centre.id;
                option.textContent = centre.name;
                centreSelect.appendChild(option);
            });

        if (stateCentres.length > 0) {
            centreSelect.disabled = false;
        } else {
            centreSelect.innerHTML =
                `<option value="">${t("noCentres")}</option>`;
        }
    }


    // ==================================================
    // SELECT CENTRE
    // ==================================================

    function selectCentreFromDropdown() {
        const centreId =
            Number(
                document.getElementById("centreSelect").value
            ) || null;

        selectedCentreId = centreId;
        selectedSlotId = null;

        clearMessage();

        if (!selectedCentreId) {
            clearSlots();
            return;
        }

        loadSlots();
    }


    function selectCentre(centreId, card) {
        selectedCentreId = Number(centreId);
        selectedSlotId = null;

        const select =
            document.getElementById("centreSelect");

        if (select) {
            select.value = String(centreId);
        }

        if (card) {
            document.querySelectorAll(".centre-card")
                .forEach(c => c.classList.remove("selected"));

            card.classList.add("selected");
        }

        document.getElementById("bookButton").disabled = true;

        clearMessage();
        loadSlots();
    }


    function clearSlots() {
        const container =
            document.getElementById("slotsContainer");

        container.innerHTML =
            `<p>${t("selectCentreFirst")}</p>`;

        document.getElementById("bookButton").disabled = true;
    }


    function loadCentres() {
        // State dropdown now loads centres directly.
        centres = centres || [];
        renderCentres();
    }


    function renderCentres() {
        const container =
            document.getElementById("centresContainer");

        if (container) {
            container.innerHTML = "";
        }
    }


    // ==================================================
    // LOAD SLOTS
    // ==================================================

    async function loadSlots() {
        const container = document.getElementById("slotsContainer");
        container.innerHTML = `<p>${t("loadingSlots")}</p>`;

        try {
            const response = await fetch(`${API}/api/slots`);
            if (!response.ok) throw new Error("Unable to load slots");

            const allSlots = await response.json();

            slots = allSlots.filter(
                slot => Number(slot.centre_id) === Number(selectedCentreId)
            );

            container.innerHTML = "";

            if (slots.length === 0) {
                container.innerHTML = `<p>${t("noSlots")}</p>`;
                return;
            }

            slots.forEach(slot => {
                const capacity = Number(slot.capacity);
                const booked = Number(slot.booked_count);
                const available = Math.max(0, capacity - booked);

                const card = document.createElement("div");
                card.className = "slot-card";

                if (available <= 0) card.classList.add("disabled");

                card.innerHTML = `
                    <h3>🕒 ${formatDate(slot.slot_date)}</h3>
                    <p>${formatTime(slot.start_time)} - ${formatTime(slot.end_time)}</p>
                    <p>${t("capacity")}: ${capacity}</p>
                    <p>${t("booked")}: ${booked}</p>
                    ${
                        available > 0
                        ? `<p class="available">${available} ${t("slotsAvailable")}</p>`
                        : `<p class="full">${t("slotFull")}</p>`
                    }
                `;

                if (available > 0) {
                    card.onclick = () => selectSlot(slot.id, card);
                }

                container.appendChild(card);
            });
        } catch (error) {
            console.error("Slot Error:", error);
            container.innerHTML = `
                <p style="color:red;">
                    ${t("unableSlots")}<br>${t("backendRunning")}
                </p>`;
        }
    }

    function selectSlot(slotId, card) {
        selectedSlotId = slotId;

        document.querySelectorAll(".slot-card")
            .forEach(c => c.classList.remove("selected"));

        card.classList.add("selected");
        document.getElementById("bookButton").disabled = false;
        clearMessage();
    }

    // ==================================================
    // BOOK SLOT
    // ==================================================

    async function bookSlot() {
        if (bookingInProgress) return;

        if (!selectedCrop) {
            showMessage(t("selectCropError"), "error");
            return;
        }

        if (!selectedCrop.crop_variety) {
            showMessage(t("selectVarietyError"), "error");
            return;
        }

        if (!validateBookingQuantity()) {
            showMessage(t("quantityError"), "error");
            return;
        }

        if (!selectedCentreId || !selectedSlotId) {
            showMessage(t("selectCentreSlot"), "error");
            return;
        }

        const button = document.getElementById("bookButton");
        bookingInProgress = true;
        button.disabled = true;
        button.textContent = t("booking");
        clearMessage();

        try {
            const entered = Number(document.getElementById("bookingQuantity").value);
            const quantityKg = convertToKg(entered, currentUnit);

            const response = await fetch(`${API}/api/bookings`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    farmer_id: farmerId,
                    crop_id: selectedCrop.id,
                    crop_variety: selectedCrop.crop_variety || "",
                    quantity: quantityKg,
                    centre_id: selectedCentreId,
                    slot_id: selectedSlotId
                })
            });

            let data = {};
            try {
                data = await response.json();
            } catch {}

            if (!response.ok) {
                throw new Error(data.message || `Booking failed (${response.status})`);
            }

            showMessage(`
                ${t("bookedSuccess")}<br><br>
                🎟️ ${t("token")}: <strong>${data.token_number}</strong><br>
                📊 ${t("queuePosition")}: <strong>${data.position}</strong><br>
                ⏳ ${t("estimatedWait")}: <strong>${data.estimated_wait} ${t("minutes")}</strong>
            `, "success");

            button.textContent = t("slotBooked");

            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 2000);

        } catch (error) {
            console.error("Booking Error:", error);
            showMessage("❌ " + error.message, "error");
            bookingInProgress = false;
            button.disabled = false;
            button.innerHTML = `<span data-i18n="bookButton">🎟️ Book Selected Slot</span>`;
            applyLanguage(localStorage.getItem("kisanSetuLanguage") || "en");
        }
    }

    function t(key) {
        const lang = localStorage.getItem("kisanSetuLanguage") || "en";
        return (translations[lang] || translations.en)[key] || translations.en[key] || key;
    }

    function applyLanguage(lang) {
        if (!translations[lang]) lang = "en";
        localStorage.setItem("kisanSetuLanguage", lang);
        document.documentElement.lang = lang;

        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            if (translations[lang][key]) el.textContent = translations[lang][key];
        });

        const select = document.getElementById("languageSelect");
        if (select) select.value = lang;

        const cropSelect = document.getElementById("cropSelect");
        if (cropSelect && (!selectedCrop || !cropSelect.value)) {
            const option = cropSelect.querySelector('option[value=""]');
            if (option) option.textContent = translations[lang].chooseCrop;
        }

        const varietySelect = document.getElementById("cropVariety");
        if (varietySelect && varietySelect.disabled) {
            const option = varietySelect.querySelector('option[value=""]');
            if (option) option.textContent = translations[lang].chooseVariety;
        }

        const varietyHint = document.getElementById("varietyHint");
        if (varietyHint) {
            varietyHint.textContent = selectedCrop
                ? varietyHint.textContent
                : translations[lang].varietyHint;
        }

        if (selectedCrop) updateAvailableQuantity();

        // Re-render dynamic cards in the selected language.
        if (centres.length && document.getElementById("centresContainer")) renderCentres();
        if (selectedCentreId && slots.length && document.getElementById("slotsContainer")) renderSlots();
    }

    function renderCentres() {
        const container = document.getElementById("centresContainer");
        container.innerHTML = "";

        centres.forEach(centre => {
            const card = document.createElement("div");
            card.className = "centre-card";
            if (Number(centre.id) === Number(selectedCentreId)) card.classList.add("selected");

            card.innerHTML = `
                <h3>📍 ${centre.name}</h3>
                <p>${t("location")}: ${centre.location}</p>
                <p>${t("capacity")}: ${centre.capacity}</p>
            `;

            card.onclick = () => selectCentre(centre.id, card);
            container.appendChild(card);
        });
    }

    function renderSlots() {
        const container = document.getElementById("slotsContainer");
        container.innerHTML = "";

        slots.forEach(slot => {
            const capacity = Number(slot.capacity);
            const booked = Number(slot.booked_count);
            const available = Math.max(0, capacity - booked);
            const card = document.createElement("div");
            card.className = "slot-card";

            if (available <= 0) card.classList.add("disabled");
            if (Number(slot.id) === Number(selectedSlotId)) card.classList.add("selected");

            card.innerHTML = `
                <h3>🕒 ${formatDate(slot.slot_date)}</h3>
                <p>${formatTime(slot.start_time)} - ${formatTime(slot.end_time)}</p>
                <p>${t("capacity")}: ${capacity}</p>
                <p>${t("booked")}: ${booked}</p>
                ${
                    available > 0
                    ? `<p class="available">${available} ${t("slotsAvailable")}</p>`
                    : `<p class="full">${t("slotFull")}</p>`
                }
            `;

            if (available > 0) card.onclick = () => selectSlot(slot.id, card);
            container.appendChild(card);
        });
    }

    // ==================================================
    // SHOW MESSAGE
    // ==================================================

    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.innerHTML =
            text;


        message.className =
            type;

    }



    // ==================================================
    // CLEAR MESSAGE
    // ==================================================

    function clearMessage() {

        const message =
            document.getElementById(
                "message"
            );


        message.innerHTML =
            "";


        message.className =
            "";

    }



    // ==================================================
    // FORMAT DATE
    // ==================================================

    function formatDate(
        dateString
    ) {

        const date =
            new Date(
                dateString
            );


        return date.toLocaleDateString(
            "en-IN",
            {

                day: "numeric",

                month: "short",

                year: "numeric"

            }
        );

    }



    // ==================================================
    // FORMAT TIME
    // ==================================================

    function formatTime(
        time
    ) {

        if (!time) {

            return "";

        }


        const parts =
            time.split(":");


        let hour =
            parseInt(
                parts[0]
            );


        const minute =
            parts[1];


        const ampm =
            hour >= 12
                ? "PM"
                : "AM";


        hour =
            hour % 12 || 12;


        return `${hour}:${minute} ${ampm}`;

    }



    // ==================================================
    // START
    // ==================================================

    const savedLanguage = localStorage.getItem("kisanSetuLanguage") || "en";
    document.getElementById("languageSelect").value = savedLanguage;
    applyLanguage(savedLanguage);

    loadCrops();
    loadStates();


</script>
